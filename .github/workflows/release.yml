name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robot_station
    steps:
      - uses: actions/checkout@v4
      - name: Require fafu_arm_sdk
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE "fafu_arm_sdk\fafu_robot_python\fafu_robot_controller.py"
          if (-not (Test-Path $sdk)) {
            throw "fafu_arm_sdk missing at $sdk; refusing customer exe."
          }
      - name: Build portable exe
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build_portable.ps1 -Force
          if (-not (Test-Path dist\FAFUArmStation.exe)) {
            throw "dist\FAFUArmStation.exe was not produced"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            robot_station/dist/FAFUArmStation.exe
            robot_station/dist/BUILD_MANIFEST.json
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require fafu_arm_sdk
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/fafu_arm_sdk/fafu_robot_python/fafu_robot_controller.py"
          if [ ! -f "$sdk" ]; then
            echo "fafu_arm_sdk missing at $sdk; refusing customer AppImage." >&2
            exit 1
          fi
      - name: Install pack dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            desktop-file-utils \
            file \
            g++ \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libfuse2 \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            libcairo2-dev \
            meson \
            ninja-build \
            pkg-config \
            patchelf \
            python3 \
            python3-dev \
            python3-pip \
            wget \
            xz-utils \
            zlib1g-dev
      - name: Build AppImage
        env:
          FAFU_ARM_SDK: ${{ github.workspace }}/fafu_arm_sdk
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          sed -i 's/\r$//' robot_station/packaging/linux/*.sh robot_station/packaging/linux/AppRun || true
          bash -n robot_station/packaging/linux/build_appimage.sh
          mkdir -p robot_station/dist
          set +e
          bash robot_station/packaging/linux/build_appimage.sh 2>&1 | tee robot_station/dist/appimage-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > robot_station/dist/appimage-build.status
          exit "$rc"
      - name: Show build log
        if: always()
        run: |
          log=robot_station/dist/appimage-build.log
          if [ -f "$log" ]; then
            echo "----- appimage-build.log -----"
            cat "$log"
            echo "----- end -----"
            python3 robot_station/packaging/linux/annotate_gha_log.py \
              "$log" robot_station/dist/appimage-build.status || true
          else
            echo "::error title=AppImage build failed::no appimage-build.log"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            robot_station/dist/FAFUArmStation-x86_64.AppImage
            robot_station/dist/BUILD_MANIFEST.json
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: artifacts
      - name: List release files
        run: ls -lah artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FAFUArmStation.exe
            artifacts/FAFUArmStation-x86_64.AppImage
          generate_release_notes: true
