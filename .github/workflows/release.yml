name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check package version matches tag
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          source = Path('robot_station/robot_station/__init__.py').read_text(encoding='utf-8')
          version = re.search(r'__version__\s*=\s*"([^"]+)"', source).group(1)
          assert os.environ['GITHUB_REF_NAME'] == 'v' + version, 'Release tag and package version differ'
          print('Validated version:', version)
          PY

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    defaults:
      run:
        working-directory: robot_station
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require fafu_arm_sdk
        shell: pwsh
        run: |
          $sdk = Join-Path $env:GITHUB_WORKSPACE "fafu_arm_sdk\fafu_robot_python\fafu_robot_controller.py"
          if (-not (Test-Path $sdk)) {
            throw "fafu_arm_sdk missing at $sdk; refusing customer exe."
          }
      - name: Build portable exe
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging\windows\build_portable.ps1 -Force
          if (-not (Test-Path dist\FAFUArmStation.exe)) {
            throw "dist\FAFUArmStation.exe was not produced"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            robot_station/dist/FAFUArmStation.exe
            robot_station/dist/BUILD_MANIFEST.json
          if-no-files-found: error

  build-linux:
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require fafu_arm_sdk
        run: |
          set -euo pipefail
          sdk="$GITHUB_WORKSPACE/fafu_arm_sdk/fafu_robot_python/fafu_robot_controller.py"
          if [ ! -f "$sdk" ]; then
            echo "fafu_arm_sdk missing at $sdk; refusing customer AppImage." >&2
            exit 1
          fi
      - name: Install pack dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            desktop-file-utils \
            file \
            g++ \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.0 \
            libfuse2 \
            libgirepository1.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.0-dev \
            libcairo2-dev \
            meson \
            ninja-build \
            pkg-config \
            patchelf \
            python3 \
            python3-dev \
            python3-pip \
            wget \
            xz-utils \
            zlib1g-dev
      - name: Build AppImage
        env:
          FAFU_ARM_SDK: ${{ github.workspace }}/fafu_arm_sdk
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          sed -i 's/\r$//' robot_station/packaging/linux/*.sh robot_station/packaging/linux/AppRun || true
          bash -n robot_station/packaging/linux/build_appimage.sh
          mkdir -p robot_station/dist
          set +e
          bash robot_station/packaging/linux/build_appimage.sh 2>&1 | tee robot_station/dist/appimage-build.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > robot_station/dist/appimage-build.status
          exit "$rc"
      - name: Show build log
        if: always()
        run: |
          log=robot_station/dist/appimage-build.log
          if [ -f "$log" ]; then
            echo "----- appimage-build.log -----"
            cat "$log"
            echo "----- end -----"
            python3 robot_station/packaging/linux/annotate_gha_log.py \
              "$log" robot_station/dist/appimage-build.status || true
          else
            echo "::error title=AppImage build failed::no appimage-build.log"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: |
            robot_station/dist/FAFUArmStation-x86_64.AppImage
            robot_station/dist/BUILD_MANIFEST.json
          if-no-files-found: error

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: artifacts
      - name: Validate artifacts and write checksums
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          output = Path('release-files')
          output.mkdir()
          checksums = []
          for platform, folder, filename, prefix, magic in (
              ('windows', 'windows-exe', 'FAFUArmStation.exe', 'exe', 'FAFUEXE1'),
              ('linux', 'linux-appimage', 'FAFUArmStation-x86_64.AppImage', 'image', 'FAFUAPP1'),
          ):
              source = Path('artifacts') / folder
              manifest = source / 'BUILD_MANIFEST.json'
              data = json.loads(manifest.read_text(encoding='utf-8-sig'))
              artifact = source / filename
              digest = hashlib.sha256(artifact.read_bytes()).hexdigest()
              assert data['version'] == version, f'{platform}: wrong version'
              assert data['magic'] == magic, f'{platform}: wrong package format'
              assert data[prefix + '_bytes'] == artifact.stat().st_size > 0, f'{platform}: wrong size'
              assert data[prefix + '_sha256'].lower() == digest, f'{platform}: checksum mismatch'
              shutil.copyfile(artifact, output / filename)
              shutil.copyfile(manifest, output / (platform + '-BUILD_MANIFEST.json'))
              checksums.append(digest + '  ' + filename)
          (output / 'SHA256SUMS').write_text('\n'.join(checksums) + '\n', encoding='utf-8')
          print('\n'.join(checksums))
          PY
      - name: Resolve release notes
        id: notes
        run: |
          notes=".github/release-notes/${{ github.ref_name }}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
            echo "use_file=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_file=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.use_file == 'true' && steps.notes.outputs.path || '' }}
          generate_release_notes: ${{ steps.notes.outputs.use_file != 'true' }}
          fail_on_unmatched_files: true
          make_latest: true
          files: |
            release-files/FAFUArmStation.exe
            release-files/FAFUArmStation-x86_64.AppImage
            release-files/windows-BUILD_MANIFEST.json
            release-files/linux-BUILD_MANIFEST.json
            release-files/SHA256SUMS
