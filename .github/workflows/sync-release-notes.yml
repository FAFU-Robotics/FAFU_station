name: sync-release-notes

on:
  push:
    branches: [main]
    paths:
      - ".github/release-notes/*.md"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update (e.g. v1.6.1)"
        required: true
        default: v1.7.0

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update notes for existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            files=(".github/release-notes/${REQUESTED_TAG}.md")
          else
            mapfile -d '' files < <(git diff --name-only --diff-filter=AM -z "$BEFORE_SHA" "$GITHUB_SHA" -- '.github/release-notes/*.md')
          fi
          for notes in "${files[@]}"; do
            tag="$(basename "$notes" .md)"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag: $tag" >&2; exit 1; }
            [ -f "$notes" ] || { echo "Missing $notes" >&2; exit 1; }
            # A new notes file must not publish a release before its builds finish.
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes-file "$notes"
            else
              echo "No existing release for $tag; the tag build will publish it."
            fi
          done
